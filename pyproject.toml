[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haindy"
version = "0.7.0"
description = "Autonomous AI Testing Agent with multi-agent architecture"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Federico Keegan"},
]
keywords = ["testing", "automation", "ai", "multi-agent", "desktop-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Testing :: Acceptance",
]

dependencies = [
    "openai>=3.3.0",
    "google-genai>=2.18.1",
    "anthropic>=0.123.0",
    "cryptography>=50.0.0",
    "platformdirs>=4.11.3",
    "rich>=15.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "pillow>=12.3.0",
    "numpy>=2.4.6",
    "jinja2>=3.1.6",
    "tiktoken>=0.14.0",
    "evdev>=1.9.3; sys_platform == 'linux'",
    "fb-idb>=1.1.7; sys_platform == 'darwin'",
    "pynput>=1.8.2; sys_platform == 'darwin' or sys_platform == 'win32'",
    "mss>=10.2.0; sys_platform == 'darwin' or sys_platform == 'win32'",
    "keyring>=25.7.0",
    "httpx>=0.28.1,<1.0.0",
    "websockets>=16.1.1,<17.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "mypy==2.3.1",
    "ruff==0.16.3",
    "pre-commit==4.6.2",
]

[project.scripts]
haindy = "haindy.main:main"

[project.urls]
Homepage = "https://github.com/Haindy/haindy"
Repository = "https://github.com/Haindy/haindy"
Issues = "https://github.com/Haindy/haindy/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["haindy*"]

[tool.setuptools.package-data]
"haindy.skills" = ["**/*.md"]
"haindy.monitoring" = ["templates/*.j2"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "UP017",  # keep existing timezone.utc style until intentional modernization
    "UP041",  # keep existing asyncio.TimeoutError style
    "UP042",  # keep existing str/Enum style
]
